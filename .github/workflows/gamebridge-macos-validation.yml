name: GameBridge legacy coverage
on:
  push:
    branches: [codex/gamebridge-macos-validation]
permissions:
  contents: read
jobs:
  legacy:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test WhiskyKit
        run: swift test --package-path WhiskyKit
      - name: Build GameBridge
        run: >-
          xcodebuild -project Whisky.xcodeproj -scheme Whisky -configuration Debug
          -destination 'platform=macOS,arch=arm64' -derivedDataPath build/local
          CODE_SIGNING_ALLOWED=NO GAMEBRIDGE_SKIP_LINT=YES build
      - name: Check that both legacy commands are discoverable
        run: |
          cli=build/local/Build/Products/Debug/GameBridge.app/Contents/Resources/WhiskyCmd
          help="$("$cli" runtime --help)"
          missing=0
          for command in audit-legacy prepare-legacy; do
            if ! grep -q "$command" <<< "$help"; then
              echo "Missing runtime command: $command"
              missing=1
            fi
          done
          exit "$missing"
      - name: Audit a standalone Windows game folder
        run: |
          cli=build/local/Build/Products/Debug/GameBridge.app/Contents/Resources/WhiskyCmd
          folder="$(mktemp -d)"
          printf 'MZ' > "$folder/broken.exe"
          "$cli" runtime audit-legacy --standalone-only --game-directory "$folder" > "$folder/report.json"
          python3 -c 'import json, sys; report=json.load(open(sys.argv[1])); assert len(report["reports"]) == 1 and len(report["reports"][0]["unreadableExecutables"]) == 1 and not report["issues"], report' "$folder/report.json"
  installers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check the ten Microsoft download hashes
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import hashlib, pathlib, re, subprocess, tempfile
          source = pathlib.Path("WhiskyKit/Sources/WhiskyKit/GameBridge/LegacyVisualCpp.swift").read_text()
          entries = re.findall(r'package\((\d+), "(x86|x64)", "([^"]+)",\s*"([0-9a-f]{64})"\)', source)
          assert len(entries) == 10, entries
          def check(entry):
              year, arch, path, expected = entry
              ext = "EXE" if year == "2005" else "exe"
              url = f"https://download.microsoft.com/download/{path}/vcredist_{arch}.{ext}"
              with tempfile.NamedTemporaryFile() as file:
                  subprocess.run(["curl", "--silent", "--show-error", "--fail", "--location",
                                  "--proto", "=https", "--proto-redir", "=https", "--max-time", "55",
                                  "--max-filesize", "67108864", "-o", file.name, url], check=True)
                  body = pathlib.Path(file.name).read_bytes()
              actual = hashlib.sha256(body).hexdigest()
              assert body.startswith(b"MZ") and actual == expected, (year, arch, actual)
              print(f"Verified Microsoft Visual C++ {year} {arch}", flush=True)
          with ThreadPoolExecutor(max_workers=5) as pool:
              list(pool.map(check, entries))
          PY
