name: GameBridge regression validation
on:
  push:
    branches: [codex/gamebridge-macos-validation]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reproduce installer and library regressions
        run: swift test --package-path WhiskyKit --filter 'BootstrapTests|SteamLibraryTests'
