name: GameBridge legacy coverage
on:
  push:
    branches: [codex/gamebridge-macos-validation]
permissions:
  contents: read
jobs:
  legacy:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Confirm missing game files can reach the repair flow
        run: swift test --package-path WhiskyKit --filter SteamLibraryTests.testManagedPlayLibraryKeepsDamagedGamesVisibleForRepair
