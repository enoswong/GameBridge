name: GameBridge lint diagnostics
on:
  push:
    branches: [codex/gamebridge-macos-validation]
permissions:
  contents: read
jobs:
  violations:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: SwiftLint JSON
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --strict --reporter json
