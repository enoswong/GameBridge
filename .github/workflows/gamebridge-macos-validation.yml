name: GameBridge legacy coverage
on:
  push:
    branches: [codex/gamebridge-macos-validation]
permissions:
  contents: read
jobs:
  legacy:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test WhiskyKit
        run: swift test --package-path WhiskyKit
      - name: Build GameBridge
        run: >-
          xcodebuild -project Whisky.xcodeproj -scheme Whisky -configuration Debug
          -destination 'platform=macOS,arch=arm64' -derivedDataPath build/local
          CODE_SIGNING_ALLOWED=NO GAMEBRIDGE_SKIP_LINT=YES build
      - name: Check that both legacy commands are discoverable
        run: |
          cli=build/local/Build/Products/Debug/GameBridge.app/Contents/Resources/WhiskyCmd
          help="$("$cli" runtime --help)"
          missing=0
          for command in audit-legacy prepare-legacy; do
            if ! grep -q "$command" <<< "$help"; then
              echo "Missing runtime command: $command"
              missing=1
            fi
          done
          exit "$missing"
      - name: Audit a standalone Windows game folder
        run: |
          cli=build/local/Build/Products/Debug/GameBridge.app/Contents/Resources/WhiskyCmd
          folder="$(mktemp -d)"
          printf 'MZ' > "$folder/broken.exe"
          "$cli" runtime audit-legacy --standalone-only --game-directory "$folder" > "$folder/report.json"
          python3 -c 'import json, sys; report=json.load(open(sys.argv[1])); assert len(report["reports"]) == 1 and len(report["reports"][0]["unreadableExecutables"]) == 1 and not report["issues"], report' "$folder/report.json"
