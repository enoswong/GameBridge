name: Universal validation
on:
  pull_request:
    branches:
      - codex/gamebridge-guided-steam
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: universal-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile-source-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test IPA structure verifier
        run: python3 scripts/test-mobile-ipa-verifier.py
      - name: Check research script syntax
        run: bash -n scripts/prepare-mobile-engine.sh
      - name: Verify desktop Steam patch against pinned upstream
        run: |
          git init "$RUNNER_TEMP/madeira"
          git -C "$RUNNER_TEMP/madeira" remote add origin https://github.com/willfaust/Madeira.git
          git -C "$RUNNER_TEMP/madeira" fetch --depth=1 origin fbad430410b4075192166172447c859714726de9
          git -C "$RUNNER_TEMP/madeira" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/madeira" apply --check "$GITHUB_WORKSPACE/mobile/patches/"*.patch
          git -C "$RUNNER_TEMP/madeira" apply "$GITHUB_WORKSPACE/mobile/patches/"*.patch
          git -C "$RUNNER_TEMP/madeira" diff --stat
          for name in RuntimeDependencyPolicy PortableWindowsImportReader PortableLegacyGameAudit SteamDirectoryAudit; do
            cmp "$GITHUB_WORKSPACE/WhiskyKit/Sources/GameBridgeCore/$name.swift" "$RUNNER_TEMP/madeira/app/Madeira/$name.swift"
          done
      - name: Check pinned engine source revisions
        run: |
          set -euo pipefail
          for component in FEX wine dxmt madeira-dock; do
            revision="$(git -C "$RUNNER_TEMP/madeira" ls-tree HEAD "$component" | awk '{print $3}')"
            test "${#revision}" -eq 40
            url="$(git -C "$RUNNER_TEMP/madeira" config -f .gitmodules --get "submodule.$component.url")"
            case "$url" in https://github.com/*) ;; *) exit 1 ;; esac
            git init -q "$RUNNER_TEMP/source-$component"
            git -C "$RUNNER_TEMP/source-$component" -c protocol.version=2 fetch --depth=1 --filter=blob:none --no-recurse-submodules "$url" "$revision"
            git -C "$RUNNER_TEMP/source-$component" cat-file -e "$revision^{commit}"
          done
      - name: Verify official Steam bootstrap archive
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 120 --max-filesize 2307664 \
            'https://client-update.akamai.steamstatic.com/steam_win32.zip.3e96965d109fc2d4cc14206b2fc4ec960a746ed3' \
            -o "$RUNNER_TEMP/steam-bootstrap.zip"
          test "$(wc -c < "$RUNNER_TEMP/steam-bootstrap.zip")" -eq 2307664
          echo "1369615c795b60de822876b4dc4042186cf58d0dc8f63ea1371167f667e16925  $RUNNER_TEMP/steam-bootstrap.zip" | sha256sum -c -
          python3 - "$RUNNER_TEMP/steam-bootstrap.zip" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              files = [i for i in archive.infolist() if i.filename == 'steam.exe']
              assert len(files) == 1 and 64 <= files[0].file_size <= 64 * 1024 * 1024
              with archive.open(files[0]) as executable:
                  assert executable.read(2) == b'MZ'
          print('Pinned bootstrap archive contains the expected Windows executable')
          PY
  apple-platforms:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test packages
        run: swift test --package-path WhiskyKit
      - name: Typecheck portable core for iOS simulator
        run: |
          xcrun --sdk iphonesimulator swiftc \
            -target arm64-apple-ios17.0-simulator \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -typecheck WhiskyKit/Sources/GameBridgeCore/*.swift
      - name: Typecheck portable core for physical iPhone SDK
        run: |
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios18.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -typecheck WhiskyKit/Sources/GameBridgeCore/*.swift
      - name: Parse actual mobile overlay sources
        run: |
          git init "$RUNNER_TEMP/madeira-ios"
          git -C "$RUNNER_TEMP/madeira-ios" remote add origin https://github.com/willfaust/Madeira.git
          git -C "$RUNNER_TEMP/madeira-ios" fetch --depth=1 origin fbad430410b4075192166172447c859714726de9
          git -C "$RUNNER_TEMP/madeira-ios" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/madeira-ios" apply "$GITHUB_WORKSPACE/mobile/patches/"*.patch
          xcrun --sdk iphoneos swiftc -frontend -parse -swift-version 5 \
            -target arm64-apple-ios18.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            "$RUNNER_TEMP/madeira-ios/app/Madeira/"{ContentView,Library,MadeiraApp,SteamRuntime,VCRedist,JITNetwork,RuntimeDependencyPolicy,PortableWindowsImportReader,PortableLegacyGameAudit,SteamDirectoryAudit}.swift
          xcrun plutil -lint "$RUNNER_TEMP/madeira-ios/app/Madeira/Info.plist" "$RUNNER_TEMP/madeira-ios/app/Madeira.xcodeproj/project.pbxproj"
      - name: Resolve app dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project Whisky.xcodeproj \
            -scheme Whisky -clonedSourcePackagesDirPath build/baseline/SourcePackages
      - name: Build unsigned Mac Debug app
        run: bash scripts/build-local.sh
